<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shanuli and Paplet's Album</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="navbar">Shanuli and Paplet's Album</header>

  <div class="hero">
    <div class="hero-content">
      <h1>Our Favorite Moments</h1>
      <button class="play-btn" onclick="startSlideshow()">▶ Play Slideshow</button>
    </div>
  </div>

  <main id="catalog"></main>

  <!-- Unified Modal for Photos & Videos -->
  <div id="modal" class="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <img id="modal-img" class="modal-content" src="" style="display:none;">
    <video id="modal-video" class="modal-content" controls autoplay style="display:none;"></video>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
